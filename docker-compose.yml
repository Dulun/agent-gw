name: agent-gw

services:
  gateway-core:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: agent-gw-core:latest
    container_name: agent-gw-core
    restart: always
    network_mode: host
    privileged: true
    env_file: [.env]
    volumes:
      - ./gw-data:/etc/mihomo
      - ./gateway/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]

  # The only UI. Host namespaces (nft, ip, virsh socket, ssh to the guest) are why it is
  # privileged with network_mode: host. Standard python-slim base; no custom build here.
  gw-web:
    build:
      context: ./panel
      dockerfile: Dockerfile
    image: agent-gw-panel:latest
    container_name: agent-gw-web
    restart: always
    network_mode: host
    privileged: true
    env_file: [.env]
    environment:
      SSH_KEY: /keys/id_ed25519
      VM_NAME: ${VM_NAME:-agent-vm-xlarge}
      VM_TZ: ${VM_TZ:-America/Los_Angeles}
    volumes:
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - ${PANEL_SSH_KEY:?set PANEL_SSH_KEY in .env}:/keys/id_ed25519:ro
      - ./test/guest-probe.sh:/repo/test/guest-probe.sh:ro
