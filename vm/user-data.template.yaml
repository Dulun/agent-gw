#cloud-config
# Rendered by vm/setup-vm.sh from .env + vm.env (SSH keys, IP injected).
hostname: ${VM_NAME}
manage_etc_hosts: true
timezone: ${VM_TZ}
locale: en_US.UTF-8
disable_root: false
ssh_pwauth: false
package_update: false
package_upgrade: false

write_files:
  - path: /root/.ssh/authorized_keys
    owner: root:root
    permissions: '0600'
    content: |
__SSH_KEYS__
  - path: /etc/ssh/sshd_config.d/99-agent-vm.conf
    owner: root:root
    permissions: '0644'
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
  - path: /etc/sysctl.d/99-agent-vm.conf
    owner: root:root
    permissions: '0644'
    content: |
      # v4 only by policy: the nft guard also drops IPv6, this keeps the stack from trying.
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.lo.disable_ipv6 = 1
  # Mouse on: without it the outer terminal is in alternate-screen mode, so the wheel turns
  # into Up/Down (history) instead of scrolling tmux.
  - path: /root/.tmux.conf
    owner: root:root
    permissions: '0644'
    content: |
      set -g mouse on
      set -g history-limit 50000
  - path: /etc/netplan/99-agent-ip.yaml
    owner: root:root
    permissions: '0600'
    content: |
      network:
        version: 2
        ethernets:
          enp1s0:
            dhcp4: false
            addresses: [${VM_IP}/24]
            routes:
              - to: default
                via: 192.168.122.1
            nameservers:
              addresses: [192.168.122.1]

runcmd:
  - [usermod, -p, '*', root]
  - [systemctl, enable, --now, ssh]
  - [systemctl, reload, ssh]
  - [sh, -c, 'rm -f /etc/apt/apt.conf.d/01kvm-gha-cache']
  - [sysctl, --system]
  - [netplan, apply]
  # wall clock comes from the host via qemu-guest-agent (agent-vm clock timer), not NTP.
  - [systemctl, disable, --now, systemd-timesyncd]
  - [systemctl, restart, systemd-resolved]
  - [systemctl, enable, --now, qemu-guest-agent]
  - [sh, -c, 'growpart /dev/vda 1 || true; resize2fs /dev/vda1 || true']
  # tailscale (optional): installed always, joined only when TS_AUTHKEY is baked in.
  # Install once via repo: https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list
  - [sh, -c, 'command -v tailscale >/dev/null || (curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg -o /usr/share/keyrings/tailscale-archive-keyring.gpg && curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list -o /etc/apt/sources.list.d/tailscale.list && apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tailscale && systemctl enable --now tailscaled)']
__TS_JOIN__

final_message: agent-vm cloud-init finished
